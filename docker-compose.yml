services:
  postgres:
    image: postgres:15
    container_name: my-postgres-db2
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./chat-db-backup.sql:/docker-entrypoint-initdb.d/restore.sql
    network_mode: "host"   # <-- use host networking
    # ports mapping not needed in host mode

  backend:
    build: ./server
    container_name: my-backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      cloud_name: ${cloud_name}
      api_key: ${api_key}
      api_secret: ${api_secret}
      JWT_SECRET: ${JWT_SECRET}
    network_mode: "host"
    # ports mapping not needed in host mode
    depends_on:
      - postgres

  frontend:
    build: ./client
    container_name: my-frontend
    environment:
      NEXT_PUBLIC_Backend_Url2: ${NEXT_PUBLIC_Backend_Url2}
      NEXT_PUBLIC_Frontend_Url: ${NEXT_PUBLIC_Frontend_Url}
    restart: always
    network_mode: "host"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
